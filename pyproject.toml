[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "timetree-scraper"
version = "0.1.0"
description = "Scrape public TimeTree events into JSON or ICS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ics>=0.7",
    "playwright>=1.45",
]

[project.scripts]
extract-timetree = "extract_timetree:cli"

[tool.setuptools]
py-modules = ["extract_timetree"]

[tool.pyright]
include = ["extract_timetree.py"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pyright>=1.1.414",
]
